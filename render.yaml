services:
  - type: web
    name: meta-ads-agent-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npx tsc
    preDeployCommand: npx prisma migrate deploy
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: meta-ads-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: META_MCP_URL
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        generateValue: true
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: PUBLIC_URL
        sync: false
      # OAuth do Meta. O acesso padrão do app já autoriza quem tem papel nele
      # (admin/desenvolvedor/testador), então o fluxo conecta a conta do próprio
      # dono antes do App Review — é assim que se grava o screencast da análise.
      # Para cliente sem papel no app, os escopos avançados só saem depois da
      # aprovação; até lá o caminho dele é o META_MANUAL_CONNECT_ENABLED abaixo.
      # Sem as três variáveis acima o OAuth fica desligado de qualquer forma.
      - key: META_OAUTH_ENABLED
        value: "true"
      # Conexão manual (cliente cola o próprio token). É o único caminho que
      # funciona antes da aprovação da Meta. Vire para "false" só depois de
      # confirmar que o OAuth conecta uma conta de cliente de verdade.
      - key: META_MANUAL_CONNECT_ENABLED
        value: "true"
      # Business ID do AdsGenius que o cliente adiciona como parceiro durante
      # o onboarding assistido. Não é segredo, mas varia por ambiente.
      - key: META_PARTNER_BUSINESS_ID
        sync: false
      # Credencial central SOMENTE LEITURA para confirmar que a conta exata
      # informada foi compartilhada com o AdsGenius. Nunca é usada nas
      # campanhas nem salva como conexão de cliente.
      - key: META_PARTNER_VERIFY_TOKEN
        sync: false
      - key: META_CONNECTION_SLA_HOURS
        value: "24"
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: FAL_IMAGE_MODEL
        sync: false
      - key: FAL_RENDERING_SPEED
        sync: false
      # Cota infinita no Estúdio de Criativos (pergunta de FEATURE).
      - key: CREATIVE_STUDIO_LIFETIME_EMAILS
        value: claudio_mir@yahoo.com.br
      # Dispensa a checagem de assinatura (pergunta de IDENTIDADE). Separada da
      # de cima de propósito: são decisões diferentes e misturá-las já causou
      # bug de acesso vitalício indevido. Sem esta variável, o código cai na
      # lista acima como fallback.
      - key: FOUNDER_EMAILS
        value: claudio_mir@yahoo.com.br
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ADMIN_ALERT_EMAIL
        sync: false
      - key: AI_BUDGET_ALERT_EMAIL
        sync: false
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_SANDBOX
        value: "false"
      - key: ASAAS_WEBHOOK_TOKEN
        generateValue: true

databases:
  - name: meta-ads-db
    databaseName: metaads
    user: metaads
